name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy
        
    - name: Lint with flake8
      run: |
        flake8 services/ shared/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 services/ shared/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Check formatting with black
      run: |
        black --check services/ shared/
        
    - name: Check imports with isort
      run: |
        isort --check-only --profile black services/ shared/
        
    - name: Type check with mypy
      run: |
        mypy services/ shared/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      redis:
        image: redis:7.2.3-alpine
        ports:
          - 6379:6379
      
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -r shared/libs/requirements.txt
        for service in services/*/; do
          if [ -f "$service/requirements.txt" ]; then
            pip install -r "$service/requirements.txt"
          fi
        done
        
    - name: Run tests
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        REDIS_HOST: localhost
        REDIS_PORT: 6379
      run: |
        pytest services/ shared/ --cov=. --cov-report=xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ secrets.DOCKER_REGISTRY }}/x7ai
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=sha,format=short
          
    - name: Build and push API Gateway
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./services/api-gateway/docker/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_REGISTRY }}/x7ai/api-gateway:${{ steps.meta.outputs.version }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/x7ai/api-gateway:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/x7ai/api-gateway:buildcache,mode=max
        
    - name: Build and push Auth Service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./services/auth-service/docker/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_REGISTRY }}/x7ai/auth-service:${{ steps.meta.outputs.version }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/x7ai/auth-service:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/x7ai/auth-service:buildcache,mode=max
        
    # Add similar steps for other services
    # This is a template - you would add steps for each service
