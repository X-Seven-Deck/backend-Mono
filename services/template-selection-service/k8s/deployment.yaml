apiVersion: apps/v1
kind: Deployment
metadata:
  name: template-selection-service
  namespace: x7ai
  labels:
    app: template-selection-service
    tier: backend
    component: configuration
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: template-selection-service
  template:
    metadata:
      labels:
        app: template-selection-service
        tier: backend
        component: configuration
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: template-selection-sa
      containers:
      - name: template-selection-service
        image: x7ai/template-selection-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8090
          protocol: TCP
        env:
        - name: TEMPLATE_SELECTION_PORT
          value: "8090"
        - name: LOG_LEVEL
          value: "INFO"
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: environment
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: redis-config
              key: host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: redis-config
              key: port
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: template-analytics-url
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8090
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8090
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: template-selection-config
---
apiVersion: v1
kind: Service
metadata:
  name: template-selection-service
  namespace: x7ai
  labels:
    app: template-selection-service
spec:
  type: ClusterIP
  selector:
    app: template-selection-service
  ports:
  - name: http
    port: 8090
    targetPort: 8090
    protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: template-selection-sa
  namespace: x7ai
  labels:
    app: template-selection-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: template-selection-config
  namespace: x7ai
data:
  cache_ttl: "3600"
  max_cache_size: "1000"
  enable_ml_features: "false"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: template-selection-hpa
  namespace: x7ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: template-selection-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
