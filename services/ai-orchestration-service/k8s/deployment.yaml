apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-orchestration-service
  namespace: ${K8S_NAMESPACE}
  labels:
    app: ai-orchestration-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-orchestration-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ai-orchestration-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8030"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: ai-orchestration-service
        image: ${DOCKER_REGISTRY}/x7ai/ai-orchestration-service:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8030
          name: http
        env:
        - name: LOG_LEVEL
          value: "INFO"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: TEMPORAL_HOST
          value: "temporal:7233"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-secrets
              key: openai_api_key
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8030
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8030
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
