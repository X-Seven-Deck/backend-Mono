apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-chat-service
  namespace: ${K8S_NAMESPACE}
  labels:
    app: global-chat-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: global-chat-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: global-chat-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8070"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: global-chat-service
        image: ${DOCKER_REGISTRY}/x7ai/global-chat-service:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8070
          name: http
        env:
        - name: LOG_LEVEL
          value: "INFO"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: url
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: anon_key
        - name: SUPABASE_SERVICE_ROLE_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: service_role_key
        - name: TEMPORAL_HOST
          value: "temporal:7233"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-secrets
              key: openai_api_key
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8070
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8070
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
