apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-logic-service
  namespace: ${K8S_NAMESPACE}
  labels:
    app: business-logic-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: business-logic-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: business-logic-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8020"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: business-logic-service
        image: ${DOCKER_REGISTRY}/x7ai/business-logic-service:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8020
          name: http
        env:
        - name: LOG_LEVEL
          value: "INFO"
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: url
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: anon_key
        - name: SUPABASE_SERVICE_ROLE_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: service_role_key
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: TEMPORAL_HOST
          value: "temporal:7233"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8020
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8020
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
