apiVersion: v1
kind: Service
metadata:
  name: monitoring-logging-service
  namespace: ${K8S_NAMESPACE}
  labels:
    app: monitoring-logging-service
    tier: backend
spec:
  selector:
    app: monitoring-logging-service
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP
