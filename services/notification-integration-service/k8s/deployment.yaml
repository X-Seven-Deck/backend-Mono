apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-integration-service
  namespace: ${K8S_NAMESPACE}
  labels:
    app: notification-integration-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-integration-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: notification-integration-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8060"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: notification-integration-service
        image: ${DOCKER_REGISTRY}/x7ai/notification-integration-service:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8060
          name: http
        env:
        - name: LOG_LEVEL
          value: "INFO"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: notification-secrets
              key: twilio_account_sid
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: notification-secrets
              key: twilio_auth_token
        - name: ZAPIER_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: notification-secrets
              key: zapier_webhook_url
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8060
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8060
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
