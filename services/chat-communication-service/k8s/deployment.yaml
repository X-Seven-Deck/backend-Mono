apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-communication-service
  namespace: ${K8S_NAMESPACE}
  labels:
    app: chat-communication-service
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chat-communication-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: chat-communication-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8040"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: chat-communication-service
        image: ${DOCKER_REGISTRY}/x7ai/chat-communication-service:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8040
          name: http
        env:
        - name: LOG_LEVEL
          value: "INFO"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: ELEVENLABS_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-secrets
              key: elevenlabs_api_key
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8040
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8040
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
