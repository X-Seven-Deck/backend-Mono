apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ${K8S_NAMESPACE}
  labels:
    app: api-gateway
    tier: gateway
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8001"
    prometheus.io/path: "/metrics"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: proxy
  - port: 443
    targetPort: 8443
    protocol: TCP
    name: proxy-ssl
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: admin
  selector:
    app: api-gateway
