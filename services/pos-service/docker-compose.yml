version: '3.8'

services:
  pos-service:
    build: .
    container_name: xseven-pos-service
    ports:
      - "8070:8070"
    environment:
      - ENVIRONMENT=production
      - POS_SERVICE_HOST=0.0.0.0
      - POS_SERVICE_PORT=8070
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRY=86400
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEFAULT_TAX_RATE=0.10
      - DASHBOARD_SERVICE_URL=http://analytics-dashboard:8060
    depends_on:
      - redis
    networks:
      - xseven-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: xseven-pos-redis
    ports:
      - "6379:6379"
    networks:
      - xseven-network
    restart: unless-stopped
    volumes:
      - redis-data:/data

networks:
  xseven-network:
    driver: bridge

volumes:
  redis-data:
