apiVersion: apps/v1
kind: Deployment
metadata:
  name: pos-service
  namespace: x7ai
  labels:
    app: pos-service
    service: pos
    tier: backend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pos-service
  template:
    metadata:
      labels:
        app: pos-service
        service: pos
        tier: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8070"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: pos-service
      containers:
      - name: pos-service
        image: x7ai/pos-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8070
          protocol: TCP
        - name: metrics
          containerPort: 9091
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: POS_SERVICE_HOST
          value: "0.0.0.0"
        - name: POS_SERVICE_PORT
          value: "8070"
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: url
        - name: SUPABASE_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: anon-key
        - name: SUPABASE_SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: service-key
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret
        - name: JWT_ALGORITHM
          value: "HS256"
        - name: JWT_EXPIRY
          value: "86400"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_DB
          value: "1"
        - name: DASHBOARD_SERVICE_URL
          value: "http://analytics-dashboard-service:8060"
        - name: API_GATEWAY_URL
          value: "http://api-gateway:8000"
        - name: CORS_ORIGINS
          value: "*"
        - name: DEFAULT_TAX_RATE
          value: "0.10"
        - name: RECEIPT_PREFIX
          value: "RCP"
        - name: PROMETHEUS_ENABLED
          value: "true"
        - name: PROMETHEUS_PORT
          value: "9091"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8070
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8070
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - pos-service
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: pos-service
  namespace: x7ai
  labels:
    app: pos-service
    service: pos
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8070
    targetPort: 8070
    protocol: TCP
  - name: metrics
    port: 9091
    targetPort: 9091
    protocol: TCP
  selector:
    app: pos-service
  sessionAffinity: None
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pos-service-hpa
  namespace: x7ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pos-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pos-service
  namespace: x7ai
  labels:
    app: pos-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pos-service-pdb
  namespace: x7ai
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: pos-service
