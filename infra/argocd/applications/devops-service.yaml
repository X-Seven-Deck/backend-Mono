apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: x7ai-platform
  
  source:
    repoURL: https://github.com/x7ai/backend.git
    targetRevision: main
    path: infra/kubernetes/devops-service
    
  destination:
    server: https://kubernetes.default.svc
    namespace: x7ai-production
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  revisionHistoryLimit: 10
  
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
