apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-service
  namespace: x7ai-production
  labels:
    app: devops-service
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-service
  template:
    metadata:
      labels:
        app: devops-service
        version: v1.0.0
    spec:
      containers:
      - name: devops-service
        image: x7ai/devops-service:latest
        ports:
        - containerPort: 8100
          name: http
        env:
        - name: SERVICE_NAME
          value: "devops-service"
        - name: SERVICE_PORT
          value: "8100"
        - name: ENVIRONMENT
          value: "production"
        - name: REDIS_HOST
          value: "redis-service"
        - name: PROMETHEUS_URL
          value: "http://prometheus-service:9090"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8100
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8100
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: devops-service
  namespace: x7ai-production
spec:
  selector:
    app: devops-service
  ports:
  - protocol: TCP
    port: 8100
    targetPort: 8100
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-service-hpa
  namespace: x7ai-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
