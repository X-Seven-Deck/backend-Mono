apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ${K8S_NAMESPACE}
  labels:
    app: prometheus
    tier: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.45.0
        args:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        - "--storage.tsdb.retention.time=15d"
        - "--web.console.libraries=/usr/share/prometheus/console_libraries"
        - "--web.console.templates=/usr/share/prometheus/consoles"
        ports:
        - containerPort: 9090
          name: http
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-storage
          mountPath: /prometheus
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-storage
        persistentVolumeClaim:
          claimName: prometheus-storage

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ${K8S_NAMESPACE}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              # - alertmanager:9093

    rule_files:
      # - "first_rules.yml"
      # - "second_rules.yml"

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "api-gateway"
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${K8S_NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: api-gateway
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: admin
            action: keep

      - job_name: "auth-service"
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${K8S_NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: auth-service
            action: keep

      - job_name: "business-logic-service"
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${K8S_NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: business-logic-service
            action: keep

      - job_name: "ai-orchestration-service"
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${K8S_NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: ai-orchestration-service
            action: keep

      - job_name: "chat-communication-service"
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${K8S_NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: chat-communication-service
            action: keep

      - job_name: "analytics-dashboard-service"
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${K8S_NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: analytics-dashboard-service
            action: keep

      - job_name: "notification-integration-service"
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${K8S_NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: notification-integration-service
            action: keep

      - job_name: "global-chat-service"
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${K8S_NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: global-chat-service
            action: keep

      - job_name: "kubernetes-nodes"
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-storage
  namespace: ${K8S_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---

apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ${K8S_NAMESPACE}
  labels:
    app: prometheus
    tier: monitoring
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: http
  type: ClusterIP
