---

apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: ${K8S_NAMESPACE}
type: Opaque
data:
  admin_user: ${GRAFANA_ADMIN_USER_BASE64}
  admin_password: ${GRAFANA_ADMIN_PASSWORD_BASE64}

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage
  namespace: ${K8S_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---

apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ${K8S_NAMESPACE}
  labels:
    app: grafana
    tier: monitoring
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  type: ClusterIP
