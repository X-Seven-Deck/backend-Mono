apiVersion: v1
kind: Secret
metadata:
  name: supabase-secrets
  namespace: ${K8S_NAMESPACE}
type: Opaque
data:
  url: ${SUPABASE_URL_BASE64}
  anon_key: ${SUPABASE_ANON_KEY_BASE64}
  service_role_key: ${SUPABASE_SERVICE_ROLE_KEY_BASE64}

---

apiVersion: v1
kind: Secret
metadata:
  name: ai-secrets
  namespace: ${K8S_NAMESPACE}
type: Opaque
data:
  openai_api_key: ${OPENAI_API_KEY_BASE64}
  elevenlabs_api_key: ${ELEVENLABS_API_KEY_BASE64}

---

apiVersion: v1
kind: Secret
metadata:
  name: notification-secrets
  namespace: ${K8S_NAMESPACE}
type: Opaque
data:
  twilio_account_sid: ${TWILIO_ACCOUNT_SID_BASE64}
  twilio_auth_token: ${TWILIO_AUTH_TOKEN_BASE64}
  zapier_webhook_url: ${ZAPIER_WEBHOOK_URL_BASE64}

---

apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: ${K8S_NAMESPACE}
type: Opaque
data:
  jwt_secret: ${JWT_SECRET_BASE64}
