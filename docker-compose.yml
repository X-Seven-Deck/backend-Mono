version: '3.8'

services:
  # API Gateway (Kong)
  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/docker/Dockerfile
    container_name: x7ai-api-gateway
    ports:
      - "8000:8000"  # Proxy
      - "8001:8001"  # Admin API
      - "8443:8443"  # Proxy (HTTPS)
      - "8444:8444"  # Admin API (HTTPS)
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/declarative/kong.yaml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
    volumes:
      - ./services/api-gateway/app/kong.yaml:/usr/local/kong/declarative/kong.yaml
    networks:
      - x7ai-network
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service (using cloud Supabase)
  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/docker/Dockerfile
    container_name: x7ai-auth-service
    ports:
      - "8010:8010"
    env_file:
      - ./services/auth-service/.env
    environment:
      - SUPABASE_URL=https://ydlmkvkfmmnitfhjqakt.supabase.co
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkbG1rdmtmbW1uaXRmaGpxYWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0MDc2MjcsImV4cCI6MjA3NDk4MzYyN30.pIwAppb0izuvu3pZixslBcdcMfNbfMo4slQ-yPDTQIg
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkbG1rdmtmbW1uaXRmaGpxYWt0Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc1OTQwNzYyNywiZXhwIjoyMDc0OTgzNjI3fQ.B32-5c2KYzMCm8IBvT4xeSwcuGpb3mVDA9XMkkUDA6M
      - JWT_SECRET=super-secret-jwt-token-for-local-dev
      - JWT_EXPIRY=86400
      - AUTH_SERVICE_PORT=8010
      - AUTH_SERVICE_HOST=0.0.0.0
      - NODE_ENV=development
      - LOG_LEVEL=debug
    volumes:
      - ./services/auth-service/app:/app/app
    networks:
      - x7ai-network
    # Removed dependencies on local Supabase services

  # Business Logic Service
  business-logic-service:
    build:
      context: .
      dockerfile: ./services/business-logic-service/docker/Dockerfile
    container_name: x7ai-business-logic-service
    ports:
      - "8020:8020"
    env_file:
      - .env
    volumes:
      - ./services/business-logic-service/app:/app/app
    networks:
      - x7ai-network
    depends_on:
      - redis
      - kafka
      - temporal

  # AI Orchestration Service
  ai-orchestration-service:
    build:
      context: .
      dockerfile: ./services/ai-orchestration-service/docker/Dockerfile
    container_name: x7ai-ai-orchestration-service
    ports:
      - "8030:8030"
    env_file:
      - .env
    volumes:
      - ./services/ai-orchestration-service/app:/app/app
    networks:
      - x7ai-network
    depends_on:
      - redis
      - temporal

  # Chat & Communication Service
  chat-communication-service:
    build:
      context: .
      dockerfile: ./services/chat-communication-service/docker/Dockerfile
    container_name: x7ai-chat-communication-service
    ports:
      - "8040:8040"
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - ./services/chat-communication-service/app:/app/app
    networks:
      - x7ai-network
    depends_on:
      - redis
      - kafka

  # Analytics Dashboard Service
  analytics-dashboard-service:
    build:
      context: .
      dockerfile: ./services/analytics-dashboard-service/docker/Dockerfile
    container_name: x7ai-analytics-dashboard-service
    ports:
      - "8050:8050"
    env_file:
      - .env
    volumes:
      - ./services/analytics-dashboard-service/app:/app/app
    networks:
      - x7ai-network
    depends_on:
      - kafka

  # Notification & Integration Service
  notification-integration-service:
    build:
      context: .
      dockerfile: ./services/notification-integration-service/docker/Dockerfile
    container_name: x7ai-notification-integration-service
    ports:
      - "8060:8060"
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - ./services/notification-integration-service/app:/app/app
    networks:
      - x7ai-network
    depends_on:
      - kafka

  # Monitoring & Logging Service
  monitoring-logging-service:
    build:
      context: .
      dockerfile: ./services/monitoring-logging-service/docker/Dockerfile
    container_name: x7ai-monitoring-logging-service
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./services/monitoring-logging-service/app:/app/app
    networks:
      - x7ai-network
    depends_on:
      - elasticsearch

  # Global Chat Service
  global-chat-service:
    build:
      context: .
      dockerfile: ./services/global-chat-service/docker/Dockerfile
    container_name: x7ai-global-chat-service
    ports:
      - "8070:8070"
    env_file:
      - .env
    volumes:
      - ./services/global-chat-service/app:/app/app
    networks:
      - x7ai-network
    depends_on:
      redis:
        condition: service_started
      temporal:
        condition: service_started

  # Template Selection Service
  template-selection-service:
    build:
      context: .
      dockerfile: ./services/template-selection-service/docker/Dockerfile
    container_name: x7ai-template-selection-service
    ports:
      - "8090:8090"
    env_file:
      - ./services/template-selection-service/.env
    volumes:
      - ./services/template-selection-service/app:/app/app
    networks:
      - x7ai-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  devops-service:
    build:
      context: .
      dockerfile: ./services/devops-service/docker/Dockerfile
    container_name: x7ai-devops-service
    ports:
      - "8100:8100"
    env_file:
      - ./services/devops-service/.env
    volumes:
      - ./services/devops-service/app:/app/app
    networks:
      - x7ai-network
    depends_on:
      - redis
      - prometheus
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: x7ai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - x7ai-network
    depends_on:
      - api-gateway

  grafana:
    image: grafana/grafana:10.0.3
    container_name: x7ai-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    networks:
      - x7ai-network
    depends_on:
      - prometheus

  # Vault for secrets management
  vault:
    image: hashicorp/vault:1.13.3
    container_name: x7ai-vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=x7ai-root-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - x7ai-network

  # PostgreSQL Database (for other services that need local DB)
  db:
    image: postgres:15.3-alpine
    container_name: x7ai-supabase-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - x7ai-network

  # Redis
  redis:
    image: redis:7.2.3-alpine
    container_name: x7ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - x7ai-network

  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: x7ai-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - x7ai-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: x7ai-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - x7ai-network

  # Temporal
  temporal:
    image: temporalio/auto-setup:1.22.4
    container_name: x7ai-temporal
    ports:
      - "7233:7233"  # gRPC
      - "8233:8233"  # Web UI
    environment:
      - CASSANDRA_SEEDS=cassandra
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
    depends_on:
      - cassandra
    networks:
      - x7ai-network

  cassandra:
    image: cassandra:4.1.3
    container_name: x7ai-cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - x7ai-network

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: x7ai-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - x7ai-network

networks:
  x7ai-network:
    driver: bridge

volumes:
  grafana-data:
  postgres-data:
  redis-data:
  cassandra-data:
  elasticsearch-data:
